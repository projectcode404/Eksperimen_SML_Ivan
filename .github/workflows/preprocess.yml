name: Automated Preprocessing

on:
  push:
    branches: [main]
    paths:
      - 'online_retail_raw/**'
      - 'preprocessing/automate_Ivan.py'
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r preprocessing/requirements.txt

      - name: Run preprocessing
        working-directory: preprocessing
        run: |
          python automate_Ivan.py

      - name: Commit updated preprocessed dataset
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update preprocessed dataset (automated)"
          file_pattern: 'preprocessing/online_retail_preprocessing/*.csv'
